name: Updater end-to-end (Windows)

# Proves the in-game updater on a real Windows machine. The given (pre)release must carry:
#   Wildmere-<old>-Windows-x64.zip                    the installed "old" version
#   Wildmere-0.1.99-Windows-x64.zip                   a newer build used as the update
#   updater-test-feed.json + updater-test-feed.json.sig   a manifest signed with the release key whose
#                                                     windows asset points at http://127.0.0.1:8765/...
# (tools/release/stage-updater-test.sh builds and uploads these.) The old app is started with
# -updatefeed pointing at a local web server; it must download, verify, install and relaunch as 0.1.99.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag that carries the updater test assets, e.g. v0.1.3-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download test assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dl, feed, install, logs | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'Wildmere-*-Windows-x64.zip' --pattern 'updater-test-feed.json*' --dir dl
          Get-ChildItem dl | Format-Table Name, Length -AutoSize
          $new = Get-ChildItem dl -Filter 'Wildmere-0.1.99-Windows-x64.zip' | Select-Object -First 1
          $old = Get-ChildItem dl -Filter 'Wildmere-*-Windows-x64.zip' | Where-Object { $_.Name -ne $new.Name } | Select-Object -First 1
          if (-not $new -or -not $old) { Write-Output '::error::missing old/new Windows zips on the release'; exit 1 }
          Copy-Item $new.FullName feed\
          Copy-Item dl\updater-test-feed.json feed\wildmere-update.json
          Copy-Item dl\updater-test-feed.json.sig feed\wildmere-update.json.sig
          Expand-Archive -Path $old.FullName -DestinationPath install
          if (-not (Test-Path install\Wildmere\Wildmere.exe)) { Write-Output '::error::old zip has no Wildmere\Wildmere.exe'; exit 1 }
          "OLD=$($old.Name)" | Add-Content $env:GITHUB_ENV

      - name: Run the old version against a local update feed
        shell: pwsh
        run: |
          $feed = Start-Process -PassThru -WindowStyle Hidden -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',"$PWD\feed"
          Start-Sleep -Seconds 2
          $env:WM_UPDATE_RELAUNCH_ARGS = "-batchmode -nographics -logFile $PWD\logs\new.log -quitafter 12"
          $p = Start-Process -PassThru -FilePath "$PWD\install\Wildmere\Wildmere.exe" -ArgumentList '-batchmode','-nographics','-logFile',"$PWD\logs\old.log",'-updatefeed','http://127.0.0.1:8765/wildmere-update.json','-updatetest','-quitafter','90'
          $p.WaitForExit(150000) | Out-Null
          # The helper swaps the folder after exit and relaunches the new version.
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path logs\new.log) -and (Select-String -Path logs\new.log -Pattern 'WM_UPDATE' -Quiet)) { break }
            Start-Sleep -Seconds 1
          }
          Start-Sleep -Seconds 15
          Stop-Process -Id $feed.Id -ErrorAction SilentlyContinue
          $upd = Join-Path $env:USERPROFILE 'AppData\LocalLow\Wildmere\Wildmere\Updates\install.log'
          if (Test-Path $upd) { Copy-Item $upd logs\install.log }

      - name: Check the result
        shell: pwsh
        run: |
          $fail = 0
          function Check($ok, $what) { if ($ok) { Write-Output "PASS  $what" } else { Write-Output "::error::FAIL  $what"; $script:fail++ } }
          Get-Content logs\old.log -ErrorAction SilentlyContinue | Select-String 'WM_UPDATE|WM_BOOT' | ForEach-Object { "old: $_" }
          Get-Content logs\install.log -ErrorAction SilentlyContinue | ForEach-Object { "helper: $_" }
          Get-Content logs\new.log -ErrorAction SilentlyContinue | Select-String 'WM_UPDATE|WM_BOOT' | ForEach-Object { "new: $_" }
          Check (Select-String -Path logs\old.log -Pattern 'WM_UPDATE ready version=0.1.99' -Quiet) 'old app downloaded and verified 0.1.99'
          Check (Select-String -Path logs\install.log -Pattern 'installed' -Quiet) 'helper swapped the install folder'
          Check (Select-String -Path logs\new.log -Pattern 'WM_UPDATE installed .*to=0.1.99' -Quiet) 'relaunched app reports the update to 0.1.99'
          Check (Test-Path install\Wildmere\Wildmere.exe) 'Wildmere.exe present after the swap'
          Check (-not (Test-Path install\Wildmere.previous)) 'backup folder removed'
          if ($fail -gt 0) { exit 1 }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-windows-${{ inputs.tag }}
          path: logs/
          if-no-files-found: warn
